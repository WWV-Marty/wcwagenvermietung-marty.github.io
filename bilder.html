<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilder – WC-Wagen Marty</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9fcff;
      color: #222;
    }

    header {
      background-color: #cde7ff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      color: #004a8f;
      font-size: 1.5rem;
    }

    nav a {
      color: #004a8f;
      text-decoration: none;
      margin-left: 1.5rem;
      font-weight: 600;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      padding: 2rem;
      max-width: 1000px;
      margin: auto;
    }

    img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: block;
    }

    .section {
      margin-bottom: 25px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    footer {
      background-color: #cde7ff;
      text-align: center;
      padding: 1rem;
    }

    .icons a {
      margin: 0 10px;
      text-decoration: none;
      color: #004a8f;
      font-weight: bold;
    }

    /* Responsive */
    @media (max-width: 800px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 500px) {
      .grid-4,
      .grid-3,
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

    </div>

    <!-- Grundriss -->
    <div class="section">
      <img src="images/grundriss.jpg" alt="" loading="lazy">
    </div>

    <!-- Innen -->
    <div class="section">
      <img src="images/innen-lavabo.jpg" alt="" loading="lazy">
    </div>

    <!-- Hebeanlage -->
    <div class="section grid-3">
      <img src="images/hebeanlage-1.jpg" alt="" loading="lazy">
      <img src="images/hebeanlage-2.jpg" alt="" loading="lazy">
      <img src="images/hebeanlage-3.jpg" alt="" loading="lazy">

    <!-- Zubehör Deckel -->
